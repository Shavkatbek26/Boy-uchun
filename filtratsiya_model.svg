<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Arial, sans-serif">

  <!-- Fon -->
  <rect width="900" height="620" fill="#f0f4f8"/>

  <!-- Sarlavha -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">
    Ko'p qatlamli naporli va sizot suvlarning g'ovak muhitda filtratsiya jarayoni
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 1-QATLAM: Tuproq yuzasi (yer usti) -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Yer usti o'tloq -->
  <rect x="40" y="50" width="820" height="30" fill="#4a7c59" rx="3"/>
  <text x="450" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="white">YER YUZASI</text>

  <!-- Yomg'ir tomchilari -->
  <text x="80" y="48" font-size="14" fill="#3a7bd5">💧</text>
  <text x="160" y="45" font-size="14" fill="#3a7bd5">💧</text>
  <text x="240" y="48" font-size="14" fill="#3a7bd5">💧</text>
  <text x="320" y="44" font-size="14" fill="#3a7bd5">💧</text>
  <line x1="80" y1="50" x2="80" y2="55" stroke="#3a7bd5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="160" y1="50" x2="160" y2="55" stroke="#3a7bd5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="240" y1="50" x2="240" y2="55" stroke="#3a7bd5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="320" y1="50" x2="320" y2="55" stroke="#3a7bd5" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Infiltratsiya o'qi -->
  <text x="430" y="48" font-size="11" fill="#3a7bd5" font-style="italic">Infiltratsiya</text>
  <line x1="460" y1="50" x2="460" y2="80" stroke="#3a7bd5" stroke-width="2" marker-end="url(#arrow_blue)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 2-QATLAM: Sizot suv qatlami (vadoz zona) -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Qatlam foni - och sariq (quruq tuproq) -->
  <rect x="40" y="80" width="820" height="70" fill="#e8d5a3" rx="2"/>

  <!-- G'ovak tuzilma (nuqtalar bilan) -->
  <circle cx="80" cy="95" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="120" cy="105" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="160" cy="93" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="200" cy="108" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="240" cy="96" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="280" cy="102" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="320" cy="94" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="360" cy="107" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="400" cy="97" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="440" cy="103" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="480" cy="95" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="520" cy="106" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="560" cy="92" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="600" cy="104" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="640" cy="96" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="680" cy="101" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="720" cy="93" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="760" cy="107" r="4" fill="#c4a35a" opacity="0.6"/>
  <circle cx="800" cy="98" r="3" fill="#c4a35a" opacity="0.6"/>
  <circle cx="840" cy="103" r="4" fill="#c4a35a" opacity="0.6"/>

  <!-- Sizot suv sathi (erkin sirt) - to'lqinli chiziq -->
  <path d="M40,130 Q100,122 160,130 Q220,138 280,130 Q340,122 400,130 Q460,138 520,130 Q580,122 640,130 Q700,138 760,130 Q820,122 860,130" 
        fill="none" stroke="#2196F3" stroke-width="2.5" stroke-dasharray="8,3"/>

  <!-- Sizot suv belgisi -->
  <text x="660" y="128" font-size="10" fill="#1565C0" font-style="italic">Sizot suv sathi (erkin sirt)</text>

  <!-- Sizot suv zona (suv bilan to'lgan) - och ko'k -->
  <rect x="40" y="130" width="820" height="20" fill="#90CAF9" opacity="0.7"/>

  <!-- Qatlam nomi -->
  <text x="450" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d4037">
    I - SIZOT SUV QATLAMI (h₁)
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 3-QATLAM: Birinchi suv o'tkazmaydigan qatlam -->
  <!-- ═══════════════════════════════════════════════ -->

  <rect x="40" y="150" width="820" height="25" fill="#795548" rx="2"/>
  <!-- Giltuproq strukturasi -->
  <line x1="60" y1="158" x2="860" y2="158" stroke="#6d4c41" stroke-width="1" stroke-dasharray="15,5"/>
  <line x1="60" y1="165" x2="860" y2="165" stroke="#6d4c41" stroke-width="1" stroke-dasharray="10,8"/>
  <text x="450" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="white">
    SUYO'TKAZMAS QATLAM (Loy/Gil) — K_b₁
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 4-QATLAM: Birinchi naporli suv qatlami -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Qatlam foni - ko'k (naporli suv) -->
  <rect x="40" y="175" width="820" height="80" fill="#1565C0" rx="2" opacity="0.85"/>

  <!-- Napr chiziqlar (gorizontal oqim) -->
  <line x1="55" y1="195" x2="855" y2="195" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="205" x2="855" y2="205" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="215" x2="855" y2="215" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="225" x2="855" y2="225" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="235" x2="855" y2="235" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="20,5"/>

  <!-- Oqim yo'nalishlari -->
  <text x="70" y="218" font-size="16" fill="#E3F2FD">→</text>
  <text x="150" y="218" font-size="16" fill="#E3F2FD">→</text>
  <text x="230" y="218" font-size="16" fill="#E3F2FD">→</text>
  <text x="310" y="218" font-size="16" fill="#E3F2FD">→</text>

  <text x="450" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
    II - NAPORLI SUV QATLAMI (H₁) — BOSIMLI SUQILIB KIRISH
  </text>

  <!-- Napr ko'rsatgich (piezo) -->
  <text x="700" y="218" font-size="11" fill="#E3F2FD">H₁(x,t) — napr sathi</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 5-QATLAM: Ikkinchi suyo'tkazmas qatlam -->
  <!-- ═══════════════════════════════════════════════ -->

  <rect x="40" y="255" width="820" height="25" fill="#4E342E" rx="2"/>
  <line x1="60" y1="263" x2="860" y2="263" stroke="#3E2723" stroke-width="1" stroke-dasharray="15,5"/>
  <line x1="60" y1="270" x2="860" y2="270" stroke="#3E2723" stroke-width="1" stroke-dasharray="10,8"/>
  <text x="450" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="white">
    SUYO'TKAZMAS QATLAM (Qoya/Granit) — K_b₂
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 6-QATLAM: Ikkinchi naporli suv qatlami -->
  <!-- ═══════════════════════════════════════════════ -->

  <rect x="40" y="280" width="820" height="80" fill="#0D47A1" rx="2" opacity="0.9"/>

  <!-- Napr chiziqlar -->
  <line x1="55" y1="298" x2="855" y2="298" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="308" x2="855" y2="308" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="318" x2="855" y2="318" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="328" x2="855" y2="328" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="20,5"/>
  <line x1="55" y1="338" x2="855" y2="338" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="20,5"/>

  <text x="450" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
    III - NAPORLI SUV QATLAMI (H₂) — ARTEZIAN BOSIMI
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 7-QATLAM: Uchinchi suyo'tkazmas qatlam -->
  <!-- ═══════════════════════════════════════════════ -->

  <rect x="40" y="360" width="820" height="25" fill="#212121" rx="2"/>
  <text x="450" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#9E9E9E">
    ASOS QATLAMI (Toshqatlam) — suv o'tmaydi
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- QUDUQ 1 — Sizot quduq -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Quduq devori -->
  <rect x="148" y="80" width="14" height="120" fill="#37474F" rx="2"/>
  <!-- Quduq bo'shlig'i -->
  <rect x="152" y="80" width="6" height="120" fill="#B3E5FC" opacity="0.9"/>
  <!-- Quduq tepasi -->
  <rect x="142" y="74" width="26" height="12" fill="#546E7A" rx="3"/>
  <text x="155" y="72" text-anchor="middle" font-size="10" fill="#37474F" font-weight="bold">Q₁</text>

  <!-- Sizot suv kirib kelishi -->
  <line x1="148" y1="135" x2="130" y2="135" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow_blue2)"/>
  <line x1="162" y1="135" x2="180" y2="135" stroke="#2196F3" stroke-width="2" marker-start="url(#arrow_blue3)"/>

  <text x="155" y="210" text-anchor="middle" font-size="10" fill="#E3F2FD" font-style="italic">Sizot</text>
  <text x="155" y="222" text-anchor="middle" font-size="10" fill="#E3F2FD" font-style="italic">quduq</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- QUDUQ 2 — Naporli (artezian) quduq -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Quduq devori -->
  <rect x="448" y="80" width="14" height="310" fill="#1B5E20" rx="2"/>
  <rect x="452" y="80" width="6" height="310" fill="#A5D6A7" opacity="0.9"/>
  <!-- Quduq tepasi va napr ko'rsatgich -->
  <rect x="442" y="74" width="26" height="12" fill="#2E7D32" rx="3"/>
  <!-- Artezian napr ko'tarish -->
  <line x1="455" y1="50" x2="455" y2="80" stroke="#43A047" stroke-width="3"/>
  <!-- Suvning otilishi -->
  <path d="M455,50 Q440,30 430,20" fill="none" stroke="#43A047" stroke-width="2"/>
  <path d="M455,50 Q470,30 480,20" fill="none" stroke="#43A047" stroke-width="2"/>
  <circle cx="430" cy="20" r="4" fill="#43A047"/>
  <circle cx="480" cy="20" r="4" fill="#43A047"/>
  <text x="455" y="72" text-anchor="middle" font-size="10" fill="#1B5E20" font-weight="bold">Q₂</text>
  <text x="510" y="35" font-size="10" fill="#2E7D32" font-style="italic">Artezian oqimi</text>

  <!-- Napr sathi ko'rsatgich -->
  <line x1="455" y1="50" x2="580" y2="50" stroke="#43A047" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="585" y="54" font-size="10" fill="#2E7D32">Piezometrik sath</text>

  <!-- Naporli suv kirib kelishi - 1-qatlamdan -->
  <line x1="448" y1="220" x2="420" y2="220" stroke="#64B5F6" stroke-width="2" marker-end="url(#arrow_white)"/>
  <line x1="462" y1="220" x2="490" y2="220" stroke="#64B5F6" stroke-width="2"/>

  <!-- Naporli suv kirib kelishi - 2-qatlamdan -->
  <line x1="448" y1="320" x2="420" y2="320" stroke="#90CAF9" stroke-width="2" marker-end="url(#arrow_white2)"/>
  <line x1="462" y1="320" x2="490" y2="320" stroke="#90CAF9" stroke-width="2"/>

  <text x="455" y="420" text-anchor="middle" font-size="10" fill="#388E3C" font-style="italic">Artezian</text>
  <text x="455" y="432" text-anchor="middle" font-size="10" fill="#388E3C" font-style="italic">quduq</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- SUVO'TKAZMAS QATLAM ORQALI SIZIB O'TISH -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- O'tish oqimlari (vertikal) -->
  <line x1="650" y1="150" x2="650" y2="175" stroke="#FF9800" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow_orange)"/>
  <text x="660" y="165" font-size="9" fill="#E65100" font-style="italic">Sizib o'tish (w)</text>

  <line x1="700" y1="255" x2="700" y2="280" stroke="#FF9800" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow_orange2)"/>
  <text x="710" y="270" font-size="9" fill="#E65100" font-style="italic">Sizib o'tish</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- MATEMATIK MODEL TENGLAMASI -->
  <!-- ═══════════════════════════════════════════════ -->

  <rect x="40" y="395" width="820" height="210" fill="white" rx="8" stroke="#90A4AE" stroke-width="1.5"/>

  <text x="450" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">
    MATEMATIK MODEL (3.1 — 3.5 tenglamalar tizimi)
  </text>

  <!-- Naporli suv tenglamasi -->
  <rect x="55" y="425" width="370" height="80" fill="#E3F2FD" rx="6" stroke="#1565C0" stroke-width="1"/>
  <text x="240" y="443" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">Naporli suv qatlami:</text>
  <text x="240" y="462" text-anchor="middle" font-size="12" fill="#0D47A1" font-style="italic">
    T·∂²H/∂x² − μ·∂H/∂t − K_b(H−h)/m_b + f(x,t) = 0
  </text>
  <text x="240" y="480" text-anchor="middle" font-size="10" fill="#1565C0">
    T — o'tkazuvchanlik, μ — elastik suv berish
  </text>
  <text x="240" y="495" text-anchor="middle" font-size="10" fill="#1565C0">
    K_b — suyo'tkazmas qatlam koeffitsienti
  </text>

  <!-- Sizot suv tenglamasi -->
  <rect x="475" y="425" width="370" height="80" fill="#E8F5E9" rx="6" stroke="#2E7D32" stroke-width="1"/>
  <text x="660" y="443" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Sizot suv qatlami:</text>
  <text x="660" y="462" text-anchor="middle" font-size="12" fill="#1B5E20" font-style="italic">
    ∂/∂x(K·h·∂h/∂x) − μ_0·∂h/∂t + w(x,t) = 0
  </text>
  <text x="660" y="480" text-anchor="middle" font-size="10" fill="#2E7D32">
    K — filtratsiya koeffitsienti
  </text>
  <text x="660" y="495" text-anchor="middle" font-size="10" fill="#2E7D32">
    w — infiltratsiya funksiyasi, h — sath
  </text>

  <!-- Bog'lovchi shart -->
  <rect x="55" y="515" width="790" height="40" fill="#FFF3E0" rx="6" stroke="#E65100" stroke-width="1"/>
  <text x="450" y="530" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">
    Qatlamlararo bog'liq shart (suyo'tkazmas qatlam orqali):
  </text>
  <text x="450" y="548" text-anchor="middle" font-size="12" fill="#BF360C" font-style="italic">
    q = K_b · (H − h) / m_b      [m/sutka] — vertikal sizib o'tish debiti
  </text>

  <!-- Chegara shartlari -->
  <rect x="55" y="565" width="790" height="35" fill="#F3E5F5" rx="6" stroke="#6A1B9A" stroke-width="1"/>
  <text x="450" y="580" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A1B9A">Chegara va boshlang'ich shartlar:</text>
  <text x="450" y="595" text-anchor="middle" font-size="11" fill="#4A148C" font-style="italic">
    H(x,0) = F₀(x);   H(0,t) = F₁(t);   H(L,t) = F₂(t);   h(x,0) = G₀(x)
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- O'Q BELGILARI (arrows) -->
  <!-- ═══════════════════════════════════════════════ -->

  <defs>
    <marker id="arrow_blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2196F3"/>
    </marker>
    <marker id="arrow_blue2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2196F3"/>
    </marker>
    <marker id="arrow_blue3" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,3 L8,0 L8,6 z" fill="#2196F3"/>
    </marker>
    <marker id="arrow_white" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64B5F6"/>
    </marker>
    <marker id="arrow_white2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#90CAF9"/>
    </marker>
    <marker id="arrow_orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FF9800"/>
    </marker>
    <marker id="arrow_orange2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FF9800"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CHAP TOMON — QATLAMLAR UZUNLIGI (x o'qi) -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- x o'qi -->
  <line x1="40" y1="390" x2="860" y2="390" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow_x)"/>
  <text x="870" y="394" font-size="12" fill="#546E7A" font-weight="bold">x</text>
  <text x="40" y="388" font-size="10" fill="#546E7A">0</text>
  <text x="848" y="388" font-size="10" fill="#546E7A">L</text>

  <defs>
    <marker id="arrow_x" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- CHUQURLIK ko'rsatgichi -->
  <line x1="22" y1="80" x2="22" y2="360" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow_z)"/>
  <text x="8" y="230" font-size="12" fill="#546E7A" font-weight="bold" transform="rotate(-90,8,230)">Chuqurlik (z)</text>

  <defs>
    <marker id="arrow_z" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- QATLAMLAR QALINLIGI -->
  <text x="875" y="120" font-size="9" fill="#5d4037">m₁</text>
  <line x1="870" y1="130" x2="870" y2="150" stroke="#5d4037" stroke-width="1"/>
  <text x="875" y="210" font-size="9" fill="#1565C0">m₂</text>
  <line x1="870" y1="175" x2="870" y2="255" stroke="#1565C0" stroke-width="1"/>
  <text x="875" y="320" font-size="9" fill="#0D47A1">m₃</text>
  <line x1="870" y1="280" x2="870" y2="360" stroke="#0D47A1" stroke-width="1"/>

</svg>
